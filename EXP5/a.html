<!DOCTYPE html>
<html>
<head>
    <title>CSS Color References</title>

    <style>
        .name {
            color: red;
        }        
        .hex {
            color: #0000FF;
        }
        .rgb {
            color: rgb(0, 128, 0);
        }
        .rgba {
            color: rgba(255, 0, 0, 0.5);
        }
        .hsl {
            color: hsl(240, 100%, 50%);
        }
        .hsla {
            color: hsla(120, 100%, 25%, 0.5);
        }

    </style>
</head>
<body>

    <h2 class="name">Color Name: Red</h2>

    <h2 class="hex">HEX Color: Blue</h2>

    <h2 class="rgb">RGB Color: Green</h2>

    <h2 class="rgba">RGBA Color</h2>

    <h2 class="hsl">HSL Color</h2>

    <h2 class="hsla">HSLA Color</h2>

</body>
</html>
